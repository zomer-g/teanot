<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>זומר · מחקר ענישה</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/heebo/index.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="app-page">
  <a class="skip-link" href="#content">דילוג לתוכן הראשי</a>
  <header class="app-header">
    <div class="header-start">
      <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="רשימת השיחות" aria-expanded="false" aria-controls="sidebar" hidden>
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="logo" href="/">
        <img src="/icon.svg" alt="" width="34" height="34">
        <span class="logo-text">זומר</span>
        <span class="logo-sep" aria-hidden="true">|</span>
        <span class="logo-sub">מחקר ענישה</span>
      </a>
    </div>
    <nav class="header-actions" id="headerActions" aria-label="חשבון"></nav>
  </header>
  <aside class="sensitive-banner" aria-label="אזהרה על סוג המידע">
    <strong>שימו לב:</strong>
    <span class="banner-long">המערכת אינה מיועדת לחומר אישי או רגיש. אין להעלות מסמכים או טקסט הכוללים פרטים מזהים, כגון שמות, מספרי זהות, כתובות או מידע רפואי. יש להשמיט פרטים כאלה לפני השימוש.</span>
    <span class="banner-short">אין להעלות חומר אישי או רגיש – שמות, מספרי זהות, כתובות או מידע רפואי.</span>
  </aside>
  <div id="root"></div>
  <div id="liveStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="liveAlert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
